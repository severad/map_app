<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa organizační struktury ČR</title>
    
    <!-- Tailwind CSS pro rychlý a moderní design -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS a JS pro zobrazení mapy -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100%; z-index: 1; background-color: #f3f4f6; }
        
        /* Styl pro moderní tooltipy při najetí myši */
        .custom-hover-tooltip {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(4px);
            border: 1px solid #e5e7eb !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
            border-radius: 0.5rem !important;
            padding: 8px 12px !important;
            color: #1f2937;
        }
        .custom-hover-tooltip::before {
            border-top-color: rgba(255, 255, 255, 0.95) !important;
        }

        /* Styl pro trvalé názvy okresů přímo na mapě */
        .district-label {
            background: transparent;
            border: none;
            pointer-events: none !important; /* Důležité: text neblokuje myš při klikání na okres */
        }
        .district-label span {
            display: inline-block;
            transform: translate(-50%, -50%); /* Vycentrování přesně na střed */
            font-size: 0.65rem;
            line-height: 1;
            font-weight: 700;
            color: #374151; /* Tmavě šedá */
            white-space: nowrap;
            /* Silný bílý obrys pro čitelnost na všech barvách */
            text-shadow: 
                -1px -1px 0 #ffffff,  
                 1px -1px 0 #ffffff,
                -1px  1px 0 #ffffff,
                 1px  1px 0 #ffffff,
                 0px  0px 3px #ffffff;
        }

        /* Zajištění, aby modální okno a UI panel byly nad mapou */
        #uiPanel { z-index: 500; }
        #editorModal { z-index: 1000; }
        #loader { z-index: 2000; }
    </style>
</head>
<body class="overflow-hidden relative text-gray-800">

    <!-- Načítací obrazovka -->
    <div id="loader" class="fixed inset-0 bg-white flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-gray-600 font-medium text-lg">Načítám mapu okresů ČR...</p>
    </div>

    <!-- Hlavní kontejner mapy -->
    <div id="map"></div>

    <!-- Plovoucí UI Panel (vlevo nahoře) -->
    <div id="uiPanel" class="absolute top-4 left-4 bg-white/95 backdrop-blur-sm p-5 rounded-xl shadow-lg border border-gray-200 max-w-sm">
        <h1 class="text-xl font-extrabold mb-1 text-gray-900">Správa regionů ČR</h1>
        <p class="text-sm text-gray-600 mb-4">Klikněte na libovolný okres pro přiřazení barvy a vložení poznámek.</p>
        
        <!-- Ukazatel okresu pod myší -->
        <div class="mb-5 p-3 bg-blue-50 rounded-lg border border-blue-100 text-center min-h-[5rem] flex flex-col justify-center">
            <span class="text-xs text-blue-500 font-semibold uppercase tracking-wider mb-1">Aktuální okres</span>
            <div id="hoverInfo" class="text-blue-900">Najetím myši zobrazíte</div>
        </div>
        
        <div class="flex flex-col gap-2.5">
            <button onclick="exportData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                Stáhnout nastavení (Export)
            </button>
            
            <label class="w-full bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 font-medium px-4 py-2.5 rounded-lg shadow-sm cursor-pointer transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM15.022 7.22l-4.243-4.242a1 1 0 00-1.414 0L5.122 7.22a1 1 0 001.414 1.414l2.464-2.464V14a1 1 0 102 0V6.172l2.464 2.464a1 1 0 001.414-1.414z" clip-rule="evenodd" /></svg>
                Nahrát nastavení (Import)
                <input type="file" class="hidden" accept=".json" onchange="importData(event)">
            </label>
            
            <button onclick="clearData()" class="mt-2 text-sm text-red-500 hover:text-red-700 font-medium transition-colors">
                Vymazat vše a začít znovu
            </button>
        </div>
    </div>

    <!-- Modální okno pro úpravu okresu -->
    <div id="editorModal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center transition-opacity">
        <div class="bg-white p-7 rounded-2xl shadow-2xl w-[26rem] transform transition-transform">
            <h2 class="text-2xl font-extrabold mb-1 text-gray-900" id="editorTitle">Detail a úprava okresu</h2>
            <p class="text-sm text-gray-500 mb-6">Přiřaďte barvu regionu a vlastní poznámky.</p>
            
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Předvolené barvy regionů</label>
                <div class="flex flex-wrap gap-2.5 mb-3" id="presetColors">
                    <!-- Tlačítka pro barvy se vygenerují přes JS -->
                </div>
                
                <div class="flex items-center gap-3">
                    <label class="block text-sm font-semibold text-gray-700">Vlastní barva:</label>
                    <input type="color" id="colorPicker" class="w-10 h-10 rounded border-0 cursor-pointer bg-transparent">
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Poznámky (každá na nový řádek)</label>
                <textarea id="noteInput" rows="4" placeholder="Např:&#10;Region Východ&#10;Pobočka 01&#10;Vedoucí: Jan Novák" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow text-gray-800 resize-y"></textarea>
            </div>
            
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeEditor()" class="px-5 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 font-medium rounded-lg transition-colors">Zrušit</button>
                <button onclick="saveEditor()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors">Uložit změny</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SPRÁVA STAVU APLIKACE (Data) ---
        let appState = JSON.parse(localStorage.getItem('czRegionsMapState')) || {};
        let geojsonLayer = null;
        let currentEditingLayer = null;
        let lastUsedColor = '#3b82f6'; 
        let map;

        function saveState() {
            localStorage.setItem('czRegionsMapState', JSON.stringify(appState));
        }

        // --- 2. INICIALIZACE MAPY (Leaflet) ---
        function initMap(geojsonData) {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);

            map = L.map('map', {
                zoomControl: false 
            }).setView([49.8, 15.5], 7);

            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> | &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 12,
                minZoom: 6
            }).addTo(map);

            geojsonLayer = L.geoJSON(geojsonData, {
                style: getLayerStyle,
                onEachFeature: handleFeatureEvents
            }).addTo(map);

            // Manuální korekce pozic popisků pro okresy ve tvaru "podkovy" (obklopují jiný okres), 
            // u kterých matematický střed vychází přesně do díry uprostřed.
            const customLabelPositions = {
                "Praha-východ": [50.05, 14.75], // Posunuto fyzicky na východ od Prahy
                "Praha-západ": [49.93, 14.30],  // Posunuto fyzicky na jihozápad
                "Brno-venkov": [49.08, 16.55]   // Pro jistotu i Brno-venkov (stejný případ)
            };

            // VYKRESLENÍ PERMANENTNÍCH TEXTŮ NA MAPU
            geojsonLayer.eachLayer(function(layer) {
                const name = getFeatureName(layer.feature);
                
                // Určení středu s využitím manuálních korekcí pro problémové okresy
                let center;
                if (customLabelPositions[name]) {
                    center = L.latLng(customLabelPositions[name]);
                } else if (typeof layer.getCenter === 'function') {
                    // getCenter() mapové knihovny je o něco chytřejší pro nepravidelné polygony
                    center = layer.getCenter();
                } else {
                    center = layer.getBounds().getCenter();
                }
                
                L.marker(center, {
                    icon: L.divIcon({
                        className: 'district-label',
                        html: `<span>${name}</span>`,
                        iconSize: null,
                        iconAnchor: [0, 0] 
                    }),
                    interactive: false 
                }).addTo(map);
            });

            map.fitBounds(geojsonLayer.getBounds());
        }

        // --- 3. POMOCNÉ FUNKCE PRO PRÁCI S DATY ---
        
        // Funkce s extrémně odolným překladem jmen okresů (ignoring accents)
        function getFeatureName(feature) {
            const p = feature.properties || {};
            
            // 1. Překladový slovník všech 77 okresů ČR
            const districtMap = {
                "CZ0100": "Praha", "CZ0201": "Benešov", "CZ0202": "Beroun", "CZ0203": "Kladno", "CZ0204": "Kolín", "CZ0205": "Kutná Hora", "CZ0206": "Mělník", "CZ0207": "Mladá Boleslav", "CZ0208": "Nymburk", "CZ0209": "Praha-východ", "CZ020A": "Praha-západ", "CZ020B": "Příbram", "CZ020C": "Rakovník", "CZ0311": "České Budějovice", "CZ0312": "Český Krumlov", "CZ0313": "Jindřichův Hradec", "CZ0314": "Písek", "CZ0315": "Prachatice", "CZ0316": "Strakonice", "CZ0317": "Tábor", "CZ0321": "Domažlice", "CZ0322": "Klatovy", "CZ0323": "Plzeň-město", "CZ0324": "Plzeň-jih", "CZ0325": "Plzeň-sever", "CZ0326": "Rokycany", "CZ0327": "Tachov", "CZ0411": "Cheb", "CZ0412": "Karlovy Vary", "CZ0413": "Sokolov", "CZ0421": "Děčín", "CZ0422": "Chomutov", "CZ0423": "Litoměřice", "CZ0424": "Louny", "CZ0425": "Most", "CZ0426": "Teplice", "CZ0427": "Ústí nad Labem", "CZ0511": "Česká Lípa", "CZ0512": "Jablonec nad Nisou", "CZ0513": "Liberec", "CZ0514": "Semily", "CZ0521": "Hradec Králové", "CZ0522": "Jičín", "CZ0523": "Náchod", "CZ0524": "Rychnov nad Kněžnou", "CZ0525": "Trutnov", "CZ0531": "Chrudim", "CZ0532": "Pardubice", "CZ0533": "Svitavy", "CZ0534": "Ústí nad Orlicí", "CZ0631": "Havlíčkův Brod", "CZ0632": "Jihlava", "CZ0633": "Pelhřimov", "CZ0634": "Třebíč", "CZ0635": "Žďár nad Sázavou", "CZ0641": "Blansko", "CZ0642": "Brno-město", "CZ0643": "Brno-venkov", "CZ0644": "Břeclav", "CZ0645": "Hodonín", "CZ0646": "Vyškov", "CZ0647": "Znojmo", "CZ0711": "Jeseník", "CZ0712": "Olomouc", "CZ0713": "Prostějov", "CZ0714": "Přerov", "CZ0715": "Šumperk", "CZ0721": "Kroměříž", "CZ0722": "Uherské Hradiště", "CZ0723": "Vsetín", "CZ0724": "Zlín", "CZ0801": "Bruntál", "CZ0802": "Frýdek-Místek", "CZ0803": "Karviná", "CZ0804": "Nový Jičín", "CZ0805": "Opava", "CZ0806": "Ostrava-město"
            };
            const districtNames = Object.values(districtMap);

            // Trik pro "očištění" textů - zbaví se mezer, velikosti písmen i háčků a čárek
            const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "") : "";
            
            const normalizedIndex = {};
            districtNames.forEach(name => {
                normalizedIndex[normalize(name)] = name;
            });
            
            // Speciální výjimky pro zkráceniny, které by normalizace nevyřešila
            normalizedIndex["zdarnsazavou"] = "Žďár nad Sázavou";
            normalizedIndex["zdarns"] = "Žďár nad Sázavou";
            normalizedIndex["hlavnimestopraha"] = "Praha";
            normalizedIndex["praha"] = "Praha";

            // Zkusíme najít unikátní kód, kdyby tam byl
            for (let key in p) {
                let val = String(p[key]).toUpperCase().trim();
                if (districtMap[val]) return districtMap[val];
            }

            // Prohledáme všechny hodnoty v GeoJSON datech
            for (let key in p) {
                let val = String(p[key]);
                val = val.replace(/^(Okres|okres)\s+/i, ''); // Ufikneme slovo Okres
                let normVal = normalize(val); 
                
                if (normalizedIndex[normVal]) {
                    return normalizedIndex[normVal]; 
                }
                
                // Silný fallback speciálně pro Žďár nad Sázavou, pokud je napsán velmi netradičně
                if (val.includes("Sázavou") || val.includes("Sazavou") || (val.includes("Žďár") && val.includes("S"))) {
                    return "Žďár nad Sázavou";
                }
            }

            // Extrémní záchrana pro neznámý formát
            let uniqueId = feature.id || p.ID_2 || p.OBJECTID || p.id || Math.random().toString(36).substring(7);
            return "Okres ID: " + uniqueId;
        }

        function getLayerStyle(feature) {
            const name = getFeatureName(feature);
            const state = appState[name] || {};
            return {
                fillColor: state.color || '#e5e7eb',
                weight: 1.5,
                opacity: 1,
                color: '#ffffff',
                fillOpacity: 0.8
            };
        }

        // --- 4. INTERAKTIVITA MAPY (Hover, Kliknutí, Tooltipy) ---
        function updateTooltip(layer, name, state) {
            let tooltipHtml = `<div class="text-center"><strong class="block text-gray-900">${name}</strong>`;
            
            // Pokud existují poznámky, rozdělíme je podle nových řádků na jednotlivé štítky
            if (state.note && state.note.trim() !== '') {
                const notes = state.note.split('\n').filter(n => n.trim() !== '');
                if (notes.length > 0) {
                    tooltipHtml += `<div class="mt-1 flex flex-col gap-1 items-center">`;
                    notes.forEach(note => {
                        tooltipHtml += `<span class="inline-block px-2 py-0.5 bg-indigo-100 text-indigo-800 text-xs font-bold rounded border border-indigo-200 shadow-sm">${note.trim()}</span>`;
                    });
                    tooltipHtml += `</div>`;
                }
            }
            tooltipHtml += `</div>`;
            
            layer.bindTooltip(tooltipHtml, {
                direction: 'top',
                className: 'custom-hover-tooltip',
                offset: [0, -10]
            });
        }

        function handleFeatureEvents(feature, layer) {
            const name = getFeatureName(feature);
            const state = appState[name] || {};

            updateTooltip(layer, name, state);

            layer.on({
                mouseover: (e) => {
                    const l = e.target;
                    l.setStyle({ weight: 3, color: '#111827' }); 
                    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                        l.bringToFront();
                    }
                    
                    const currentState = appState[name] || {};
                    let infoHtml = `<span class="font-bold text-gray-900">${name}</span>`;
                    
                    // Zobrazení více poznámek v levém panelu
                    if(currentState.note && currentState.note.trim() !== '') {
                        const notes = currentState.note.split('\n').filter(n => n.trim() !== '');
                        if (notes.length > 0) {
                            infoHtml += `<div class="mt-2 flex flex-col gap-1">`;
                            notes.forEach(note => {
                                infoHtml += `<span class="text-xs text-indigo-700 font-bold bg-indigo-50 border border-indigo-100 px-2 py-1 rounded shadow-sm">${note.trim()}</span>`;
                            });
                            infoHtml += `</div>`;
                        }
                    }
                    document.getElementById('hoverInfo').innerHTML = infoHtml;
                },
                mouseout: (e) => {
                    geojsonLayer.resetStyle(e.target);
                    document.getElementById('hoverInfo').innerHTML = 'Najetím myši zobrazíte';
                },
                click: (e) => {
                    openEditor(feature, e.target);
                }
            });
        }

        // --- 5. LOGIKA EDITORU (Modální okno) ---
        const presets = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#22c55e', '#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#ec4899'];
        const presetContainer = document.getElementById('presetColors');
        presets.forEach(color => {
            const btn = document.createElement('button');
            btn.className = 'w-7 h-7 rounded-full shadow-sm hover:scale-110 transition-transform focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-gray-400';
            btn.style.backgroundColor = color;
            btn.onclick = () => document.getElementById('colorPicker').value = color;
            presetContainer.appendChild(btn);
        });

        function openEditor(feature, layer) {
            currentEditingLayer = layer;
            const name = getFeatureName(feature);
            const state = appState[name] || {};
            
            document.getElementById('editorTitle').innerText = name;
            document.getElementById('colorPicker').value = state.color || lastUsedColor;
            document.getElementById('noteInput').value = state.note || '';
            
            document.getElementById('editorModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('noteInput').focus(), 50);
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.add('hidden');
            currentEditingLayer = null;
        }

        function saveEditor() {
            if (!currentEditingLayer) return;
            
            const name = getFeatureName(currentEditingLayer.feature);
            const color = document.getElementById('colorPicker').value;
            const note = document.getElementById('noteInput').value;
            
            lastUsedColor = color; 
            
            appState[name] = { color, note };
            saveState();
            
            geojsonLayer.resetStyle(currentEditingLayer);
            updateTooltip(currentEditingLayer, name, appState[name]);
            
            let infoHtml = `<span class="font-bold text-gray-900">${name}</span>`;
            if(note.trim() !== '') {
                const notes = note.split('\n').filter(n => n.trim() !== '');
                if (notes.length > 0) {
                    infoHtml += `<div class="mt-2 flex flex-col gap-1">`;
                    notes.forEach(n => {
                        infoHtml += `<span class="text-xs text-indigo-700 font-bold bg-indigo-50 border border-indigo-100 px-2 py-1 rounded shadow-sm">${n.trim()}</span>`;
                    });
                    infoHtml += `</div>`;
                }
            }
            document.getElementById('hoverInfo').innerHTML = infoHtml;
            
            closeEditor();
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('editorModal').classList.contains('hidden')) {
                if (e.key === 'Escape') closeEditor();
                // Upraveno chování klávesy Enter - ve velkém textovém poli chceme dělat nové řádky,
                // uložení přes Enter tak proběhne jen pokud uživatel drží i Ctrl.
                if (e.key === 'Enter' && e.ctrlKey) saveEditor();
            }
        });

        // --- 6. EXPORT / IMPORT (Soubory) ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "mapa_cr_regiony.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    appState = importedState;
                    saveState();
                    location.reload(); 
                } catch (err) {
                    alert('Nepodařilo se načíst soubor. Zkontrolujte, že jde o platný formát z této aplikace.');
                }
            };
            reader.readAsText(file);
        }

        function clearData() {
            if (confirm('Opravdu chcete vymazat veškeré nastavení regionů a začít s čistou mapou?')) {
                localStorage.removeItem('czRegionsMapState');
                location.reload();
            }
        }

        // --- 7. NAČTENÍ DAT A SPUŠTĚNÍ ---
        const geojsonUrls = [
            'https://gist.githubusercontent.com/carmoreira/deb0b3a5c101d1b2a47600ab225be262/raw/cb139cf24eb933b4694d07fd8bd0e979cca54d28/distictsCzechiaLow.json',
            'https://raw.githubusercontent.com/siwekm/czech-geojson/master/okresy.json'
        ];

        async function loadMapData() {
            for (const url of geojsonUrls) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const data = await response.json();
                    initMap(data);
                    return; 
                } catch (e) {
                    console.warn(`Nepodařilo se načíst z ${url}, zkouším další zdroj...`);
                }
            }
            
            document.getElementById('loader').innerHTML = `
                <div class="text-red-600 text-center bg-red-50 p-6 rounded-lg">
                    <p class="text-xl font-bold mb-2">Chyba při načítání dat mapy</p>
                    <p class="text-sm text-gray-700">Nepodařilo se stáhnout souřadnice okresů.</p>
                    <p class="text-sm text-gray-700 mt-1">Zkontrolujte připojení k internetu a obnovte stránku.</p>
                </div>
            `;
        }

        loadMapData();

    </script>
</body>
</html>
